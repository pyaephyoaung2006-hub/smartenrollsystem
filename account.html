<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>account List</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #34495e; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .no-data { text-align: center; color: #888; padding: 20px; font-style: italic; }
        .btn-group { display: flex; justify-content: space-between; margin-top: 20px; }
        .btn { padding: 10px 18px; border: none; border-radius: 5px; text-decoration: none; font-weight: bold; cursor: pointer; }
        .btn-back { background-color: #7f8c8d; color: white; }
        .btn-clear { background-color: #e74c3c; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>List of Accounts</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Password</th>
                <th>Registration Date</th>
            </tr>
        </thead>
        <tbody id="studentTableBody">
        </tbody>
    </table>

    <div class="btn-group">
        <a href="signup.html" class="btn btn-back">⬅ back to sign up</a>
        <button class="btn btn-clear" onclick="clearData()">Delete all Data</button>
    </div>
</div>

<script>
    function loadStudents() {
        const tableBody = document.getElementById('studentTableBody');
        
        const students = JSON.parse(localStorage.getItem('students')) || [];

        tableBody.innerHTML = '';

        if (students.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="5" class="no-data">There are no registered accounts yet.</td></tr>';
            return;
        }

        students.forEach(student => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${student.id}</strong></td>
                <td>${student.name}</td>
                <td>${student.email}</td>
                <td>${student.password}</td>
                <td>${student.date}</td>
            `;
            tableBody.appendChild(row);
        });
    }

    function clearData() {
        if (confirm('Are you sure to delete all account data?')) {
            localStorage.removeItem('students');
            loadStudents();
        }
    }

    window.onload = loadStudents;
</script>

</body>
</html>
