<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment System - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('https://tumeiktila.edu.mm/wp-content/uploads/2020/12/TUM-2048x1536.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            /* Login Box အောက်က အောက်ခံပုံကို Blur လုပ်ပေးသည့် အဓိကနေရာ */
            background-color: rgba(255, 255, 255, 0.4); /* မလင်းလွန်း/မမှောင်လွန်းစေရန် Semi-transparent အဖြူရောင်စပ်ထားခြင်း */
            backdrop-filter: blur(10px);               /* အနောက်က background ပုံကို အဝါး (Blur) လုပ်ပေးသည့် property */
            -webkit-backdrop-filter: blur(10px);       /* Safari browser များအတွက် support လုပ်ရန် */
            
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3); /* ရုပ်ထွက်ပိုလှစေရန် ခပ်ပါးပါး အနားကွပ်လေး ထည့်ထားခြင်း */
            width: 360px;
        }

        h1 {
            font-size: 20px;
            color: #2c3e50;
            text-align: center;
            margin-top: 0;
            margin-bottom: 5px;
        }

        h2 {
            color: #34495e;
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
            border-bottom: 2px solid #34495e;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #34495e;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.8);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #1620a7;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2191502d;
        }

        .title1 {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .title1 a {
            color: #2980b9;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1>Student Enrollment System</h1>
    <h2>Login</h2>

    <form id="loginForm" autocomplete="off">
        <div class="form-group">
            <label>ID, Name or Email</label>
            <input type="text" id="userInput" placeholder="Enter ID, Name or Email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter Password" required>
        </div>

        <button type="submit">Login</button>
        <p class="title1">Don't have an account? <a href="signup.html">Sign up</a></p>
    </form>

    <p id="message"></p>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const userInput = document.getElementById('userInput').value.trim();
        const passwordInput = document.getElementById('password').value;
        const message = document.getElementById('message');

        const ADMIN_USERNAME = "admin";
        const ADMIN_EMAIL = "admin@gmail.com";
        const ADMIN_PASSWORD = "admin123";

        if ((userInput.toLowerCase() === ADMIN_USERNAME.toLowerCase() || userInput.toLowerCase() === ADMIN_EMAIL.toLowerCase()) && 
            passwordInput === ADMIN_PASSWORD) {
            
            message.style.color = "green";
            message.innerText = "✅ Admin Login Successful!";
            
            setTimeout(() => {
                window.location.href = "admin_dashboard.html"; 
            }, 1000);
            return;
        }

        const students = JSON.parse(localStorage.getItem('students')) || [];

        const foundStudent = students.find(student => {
            const isIdMatch = student.id && student.id.toLowerCase() === userInput.toLowerCase();
            const isNameMatch = student.name && student.name.toLowerCase() === userInput.toLowerCase();
            const isEmailMatch = student.email && student.email.toLowerCase() === userInput.toLowerCase();
            
            return (isIdMatch || isNameMatch || isEmailMatch) && student.password === passwordInput;
        });

        if (foundStudent) {
            message.style.color = "green";
            message.innerText = `✅ Welcome back, ${foundStudent.name}!`;

            localStorage.setItem("currentUser", JSON.stringify(foundStudent));

            setTimeout(() => {
                window.location.href = "user_dashboard.html"; 
            }, 1000);
        } else {
            message.style.color = "#e74c3c";
            message.innerText = "Incorrect User INFO or Password!";
        }
    });
</script>

</body>
</html>
