<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Detailed Information</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; padding: 30px; color: #2c3e50; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-back { background-color: #7f8c8d; color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 14px; }
        .btn-back:hover { background-color: #6c7a7d; }

        .card { background: white; padding: 25px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card h3 { font-size: 18px; color: #8e44ad; border-bottom: 2px solid #f4f7f6; padding-bottom: 10px; margin-bottom: 15px; }

        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .info-item label { display: block; font-size: 12px; color: #7f8c8d; font-weight: bold; text-transform: uppercase; }
        .info-item span { font-size: 16px; font-weight: bold; color: #2c3e50; }

        .choice-list { list-style: none; margin-top: 10px; }
        .choice-list li { background: #f8f9fa; padding: 10px 15px; border-radius: 5px; margin-bottom: 8px; border-left: 4px solid #3498db; font-size: 14px; }
        
        .badge { padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-success { background: #d4efdf; color: #196f3d;display:inline-block;margin-top:15px; }
        .badge-danger { background: #fadbd8; color: #943126; display:inline-block;margin-top:15px;}
        .fighter{color:blue;
                font-size:40px;
                
            }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Header -->
    <div class="header">
        <h2 class="fighter"> Student Full Profile</h2>
        <a href="admin_dashboard.html" class="btn-back"> Back to Dashboard</a>
    </div>

    <!-- 1. Personal Details -->
    <div class="card">
        <h3> Personal Details</h3>
        <div class="info-grid">
            <div class="info-item">
                <label>Student ID</label>
                <span id="displayId">-</span>
            </div>
            <div class="info-item">
                <label>Full Name</label>
                <span id="displayName">-</span>
            </div>
            <div class="info-item">
                <label>Email Address</label>
                <span id="displayEmail">-</span>
            </div>
            <div class="info-item">
                <label>Gender</label>
                <span id="displayGender">-</span>
            </div>
            <div class="info-item">
            <label>Date of Birth</label>
            <span id="displayBirthdate">-</span>
        </div>
        <div class="info-item">
            <label>Phone Number</label>
            <span id="displayPhone">-</span>
        </div>
        <div class="info-item">
    <label>Parent Name</label>
    <span id="displayparentName">-</span>
</div>
<div class="info-item">
    <label>Parent Phone</label>
    <span id="displayPhone1">-</span>
</div>
<div class="info-item">
    <label>Address</label>
    <span id="displayAddress">-</span>
</div>
        </div>
    </div>

    <!-- 2. Major & Enrollment Data -->
    <div class="card">
        <h3> Major & Course Enrollment Data</h3>
        <ul id="displayCourses" class="choice-list">
        </ul>
    </div>

    <!-- 3. Hostel Information -->
    <div class="card">
        <h3> Hostel Information</h3>
        <div class="info-grid">
            <div class="info-item">
                <label>Hostel Application Status</label>
                <span id="displayHostelStatus">-</span>
            </div>
            <div class="info-item">
                <label>Selected Hostel Name</label>
                <span id="displayHostelName">-</span>
            </div>
        </div>
    </div>
</div>

<script>
    function getOrdinal(n) {
        let s = ["th", "st", "nd", "rd"];
        let v = n % 100;
        return n + (s[(v - 20) % 10] || s[v]||  s[0]);
    }

    function loadStudentDetail() {
        const selectedId = localStorage.getItem('selectedStudentId');
        const students = JSON.parse(localStorage.getItem('students')) || [];
        const currentUser = JSON.parse(localStorage.getItem('currentUser')) || {};

        const student = students.find(s => 
            s.id === selectedId || 
            ('STU-' + (students.indexOf(s) + 1)) === selectedId ||
            s.email === selectedId
        );

        if (!student) {
            alert("⚠️ Information for this student cannot be found!");
            window.location.href = "admin_dashboard.html";
            return;
        }

        let genderValue = student.gender || 
                          (currentUser.email === student.email ? currentUser.gender : null) || 
                          localStorage.getItem('gender') || 
                          'Not Specified';

      document.getElementById('displayId').innerText = (student && student.id) || selectedId || 'N/A';
document.getElementById('displayName').innerText = (student && (student.name || student.username)) || currentUser.name || 'N/A';
document.getElementById('displayEmail').innerText = (student && student.email) || currentUser.email || 'N/A';
document.getElementById('displayGender').innerText = genderValue; 

document.getElementById('displayBirthdate').innerText = (student && student.birthdate) || currentUser.birthdate || localStorage.getItem('dob') || 'N/A';
document.getElementById('displayPhone').innerText = (student && student.phone) || currentUser.phone || localStorage.getItem('phone') || 'N/A';

document.getElementById('displayparentName').innerText = (student && student.parentName) || currentUser.parentName || localStorage.getItem('parentName') || 'N/A';
document.getElementById('displayPhone1').innerText = (student && student.phone1) || currentUser.phone1 || localStorage.getItem('phone1') || 'N/A';
document.getElementById('displayAddress').innerText = (student && student.address)  ||currentUser.address||  localStorage.getItem('address') || 'N/A';

const courseContainer = document.getElementById('displayCourses');
courseContainer.innerHTML = '';

        if (student.enrolledCourses && student.enrolledCourses.length > 0) {
            student.enrolledCourses.forEach((course, index) => {
                const li = document.createElement('li');
                li.innerHTML =` <b>[${getOrdinal(index + 1)} Choice] :</b> 📖 ${course}`;
                courseContainer.appendChild(li);
            });
        } else {
            courseContainer.innerHTML = '<li style="border-left-color: #e74c3c; color: #7f8c8d;">No majors or courses selected yet.</li>';
        }

        let hostelStatus = student.hostelApplied || currentUser.hostelApplied;
        let hostelName = student.hostel || currentUser.hostel || localStorage.getItem('hostel');

        if (hostelStatus) {
            document.getElementById('displayHostelStatus').innerHTML = '<span class="badge badge-success">APPLIED</span>';
            document.getElementById('displayHostelName').innerText = hostelName || 'Hostel Assigned';
        } else {
            document.getElementById('displayHostelStatus').innerHTML = '<span class="badge badge-danger">NOT APPLIED</span>';
            document.getElementById('displayHostelName').innerText = 'N/A'; 
        }
    }

    window.onload = loadStudentDetail;
</script>

</body>
</html>
