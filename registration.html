<form id="registrationForm">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <link rel="stylesheet" href="registration.css">
</head>
    
    <label>Student ID</label>
    <input type="text" id="studentId" placeholder="Mtl-...">

    <label>Student Name</label>
    <input type="text" id="studentName" placeholder="eg: Mg... or Ma...">
    <label>Parent's Name</label>
    <input type="text" id="parentName" placeholder="eg: U Ba and Daw Mya" required>
    </label>
    <label>Date of Birth</label>
<input type="date" id="dob" required>
<label>Phone Number</label>
<input type="tel" id="phone" placeholder="09xxxxxxxxx" required>
<label>Parent's Phone Number</label>
<input type="tel" id="parentPhone" placeholder="09xxxxxxxxx" required>
<label>Address</label>
<input type="text" id="address" placeholder="Full residential address" required>
    <button type="submit">Register</button>

</form>

<script src="registration.js"></script>
